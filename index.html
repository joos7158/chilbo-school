<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noimageindex">
<meta name="theme-color" content="#1F6B52">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>칠보초 학교생활</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F6F3; --surface:#FFFFFF; --sunken:#E8EFEA; --line:#D5E0D9;
  --ink:#1B2A24; --ink-2:#51635B; --ink-3:#84958D;
  --accent:#1F6B52; --accent-ink:#FFFFFF; --accent-soft:#DDEEE6;
  --sun:#F2B632;
  --red:#C93A32; --blue:#2A66C4;
  --hol-bg:#FBE4E1; --hol-fg:#9E2B24;
  --vac-bg:#DDF0DF; --vac-fg:#23683A;
  --cer-bg:#FCEFC9; --cer-fg:#7A5505;
  --edu-bg:#DEE9FA; --edu-fg:#214F9A;
  --evt-bg:#ECE2F7; --evt-fg:#5B3592;
  --sat-bg:#EBEFEC; --sat-fg:#6D7D75;
  --display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111A16; --surface:#19251F; --sunken:#223029; --line:#2E4037;
    --ink:#E9F1EC; --ink-2:#A9BBB2; --ink-3:#7A8D84;
    --accent:#5CC29D; --accent-ink:#0C1F18; --accent-soft:#1F3A30;
    --sun:#F2B632;
    --red:#F0847C; --blue:#86B2F5;
    --hol-bg:#47221F; --hol-fg:#F7B3AD;
    --vac-bg:#1E3D27; --vac-fg:#A5DDB2;
    --cer-bg:#453710; --cer-fg:#F3D47E;
    --edu-bg:#1D3154; --edu-fg:#AFCBF8;
    --evt-bg:#35254D; --evt-fg:#D2B8F2;
    --sat-bg:#25322C; --sat-fg:#94A69D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111A16; --surface:#19251F; --sunken:#223029; --line:#2E4037;
  --ink:#E9F1EC; --ink-2:#A9BBB2; --ink-3:#7A8D84;
  --accent:#5CC29D; --accent-ink:#0C1F18; --accent-soft:#1F3A30;
  --sun:#F2B632;
  --red:#F0847C; --blue:#86B2F5;
  --hol-bg:#47221F; --hol-fg:#F7B3AD;
  --vac-bg:#1E3D27; --vac-fg:#A5DDB2;
  --cer-bg:#453710; --cer-fg:#F3D47E;
  --edu-bg:#1D3154; --edu-fg:#AFCBF8;
  --evt-bg:#35254D; --evt-fg:#D2B8F2;
  --sat-bg:#25322C; --sat-fg:#94A69D;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}

/* 학교 머리 */
.school{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge{width:52px;height:52px;border-radius:50%;background:var(--sun);color:#3B2A00;display:grid;place-items:center;font-family:var(--display);font-size:24px;flex:none}
.school h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:0;letter-spacing:.01em}
.school p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.school a{color:var(--accent)}
.school .grow{flex:1;min-width:200px}

/* 오늘 */
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tcard h2{margin:0;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em}
.tcard .big{font-family:var(--display);font-size:19px;line-height:1.3}
.tcard .menu{margin:0;color:var(--ink);font-size:14px}
.tcard .none{color:var(--ink-3);font-size:14px}
.soon{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.soon li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.dday{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);min-width:46px;flex:none}
.soon .when{color:var(--ink-3);font-size:12px;margin-left:auto;white-space:nowrap}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:11px;padding:10px 8px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .title{font-family:var(--display);font-size:21px;flex:1;text-align:center;min-width:120px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:38px;font-weight:500}
.btn:hover{background:var(--sunken)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sq{width:38px;padding:0;font-size:18px;line-height:1}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-2);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--sunken);text-align:center;font-size:12px;font-weight:600;padding:6px 0;color:var(--ink-2)}
.cal .wd.sun,.day.sun .num,.day.off .num{color:var(--red)}
.cal .wd.sat,.day.sat .num{color:var(--blue)}
.day{background:var(--surface);border:0;text-align:left;padding:5px;min-height:84px;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.day.out{background:var(--ground)}
.day.out .num{color:var(--ink-3)}
.day .num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-end;min-width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--accent);color:var(--accent-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chip{font-size:11px;line-height:1.3;border-radius:5px;padding:2px 5px;overflow-wrap:anywhere;word-break:keep-all}
.more{font-size:10px;color:var(--ink-3)}
.c-hol{background:var(--hol-bg);color:var(--hol-fg)} .d-hol{background:var(--hol-fg)}
.c-vac{background:var(--vac-bg);color:var(--vac-fg)} .d-vac{background:var(--vac-fg)}
.c-cer{background:var(--cer-bg);color:var(--cer-fg)} .d-cer{background:var(--cer-fg)}
.c-edu{background:var(--edu-bg);color:var(--edu-fg)} .d-edu{background:var(--edu-fg)}
.c-evt{background:var(--evt-bg);color:var(--evt-fg)} .d-evt{background:var(--evt-fg)}
.c-sat{background:var(--sat-bg);color:var(--sat-fg)} .d-sat{background:var(--sat-fg)}

.detail{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.detail h3{margin:0;font-size:15px;font-weight:600}
.detail .row{display:flex;flex-wrap:wrap;gap:6px}
.detail .row .chip{font-size:13px;padding:3px 9px;border-radius:7px}
.detail p{margin:0;font-size:14px;color:var(--ink-2)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* 목록 */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:4px 14px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.list li:last-child{border-bottom:0}
.list .when{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.list .what{display:flex;gap:8px;align-items:center;font-weight:500}
.list .what i{width:9px;height:9px;border-radius:50%;flex:none}
.list .past{opacity:.5}
.empty{color:var(--ink-3);text-align:center;padding:26px 0;margin:0}

/* 급식 */
.bar input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-height:38px;flex:1;min-width:150px}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.meal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.meal.is-today{border-color:var(--accent)}
.meal header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:10px 14px;background:var(--accent-soft)}
.meal header b{font-size:14px}
.meal header span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.meal ul{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.meal li{font-size:15px}
.meal li sup{font-size:10px;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums;vertical-align:baseline}
.meal details{border-top:1px solid var(--line);padding:0 14px}
.meal summary{padding:9px 0;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.meal details div{font-size:12px;color:var(--ink-2);padding-bottom:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px}
.meal .nomeal{padding:18px 14px;color:var(--ink-3);font-size:14px;margin:0}
.allergy{font-size:12px;color:var(--ink-2)}
.allergy summary{cursor:pointer;font-weight:600}
.allergy p{margin:6px 0 0}

/* 가족사진 */
.family{margin:8px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.family .frame{background:var(--surface);border:1px solid var(--line);padding:10px 10px 0;border-radius:6px;box-shadow:0 6px 18px rgba(20,40,30,.10);max-width:100%;width:560px;transform:rotate(-.6deg)}
.family img{display:block;width:100%;height:auto;border-radius:3px}
.family .ph{aspect-ratio:4/3;max-width:100%;border:2px dashed var(--line);border-radius:3px;display:grid;place-items:center;color:var(--ink-3);font-size:14px;text-align:center;padding:12px;background:var(--sunken)}
.family figcaption{font-family:var(--display);font-size:18px;text-align:center;padding:10px 4px 12px;color:var(--ink)}
@media (prefers-reduced-motion: no-preference){.family .frame{transition:transform .25s}.family .frame:hover{transform:rotate(0)}}

footer{font-size:12px;color:var(--ink-3);text-align:center;display:flex;flex-direction:column;gap:2px}

@media (max-width:560px){
  .school h1{font-size:24px}
  .panel{padding:12px}
  .day{min-height:70px;padding:3px}
  .chip{font-size:10px;padding:1px 3px;word-break:break-all}
  .legend{margin-left:0}
  .list li{grid-template-columns:1fr}
}
</style>

<div class="wrap">
  <header class="school">
    <div class="badge" aria-hidden="true">초</div>
    <div class="grow">
      <h1 id="sname"></h1>
      <p id="sinfo"></p>

  </header>

  <section class="today" id="today" aria-label="오늘"></section>

    <button role="tab" id="tab-meal" aria-controls="panel-meal" aria-selected="false">급식</button>
  </div>

  <section class="panel" id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule">

        <span><i class="d-evt"></i>행사·체험</span>
      </div>
    </div>
    <div class="bar">
      <button class="btn sq" id="m-prev" aria-label="이전 달">‹</button>
      <div class="title" id="m-title" aria-live="polite"></div>
      <button class="btn" id="m-today">이번 달</button>

  <section class="panel" id="panel-meal" role="tabpanel" aria-labelledby="tab-meal" hidden>

        <button id="mv-day" aria-pressed="true">하루</button>
        <button id="mv-week" aria-pressed="false">한 주</button>
      </div>
      <button class="btn sq" id="d-prev" aria-label="이전">‹</button>
      <input type="date" id="d-input" aria-label="급식 날짜">
      <button class="btn sq" id="d-next" aria-label="다음">›</button>
      <button class="btn" id="d-today">오늘</button>
    </div>
    <div class="title" id="meal-title" style="font-family:var(--display);font-size:19px"></div>
    <div class="meals" id="meal-body"></div>
    <details class="allergy">
      <summary>메뉴 옆 숫자는 알레르기 유발 식품 번호예요</summary>
      <p>1 난류 · 2 우유 · 3 메밀 · 4 땅콩 · 5 대두 · 6 밀 · 7 고등어 · 8 게 · 9 새우 · 10 돼지고기 · 11 복숭아 · 12 토마토 · 13 아황산류 · 14 호두 · 15 닭고기 · 16 쇠고기 · 17 오징어 · 18 조개류 · 19 잣</p>
    </details>
  </section>

  <figure class="family" id="family"></figure>

  <footer>
    <span id="updated"></span>
    <span>자료: 나이스 교육정보 개방 포털. 학교 사정에 따라 실제와 다를 수 있어요.</span>
  </footer>
</div>

<script>
(function(){
  const D = DATA, S = D.schedule, M = D.meals;
  const $ = id => document.getElementById(id);
  const WD = ['일','월','화','수','목','금','토'];
  const pad = n => String(n).padStart(2,'0');
  const key = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const parse = k => { const a = k.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
  const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const diff = (a,b) => Math.round((a-b)/86400000);
  const md = d => (d.getMonth()+1) + '월 ' + d.getDate() + '일';
  const mdw = d => md(d) + ' (' + WD[d.getDay()] + ')';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const now = new Date();
  const TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const TK = key(TODAY);
  const FIRST = new Date(D.ay, 2, 1), LAST = new Date(D.ay+1, 1, 1);
  const mealKeys = Object.keys(M).sort();

  function cat(e){
    const n = e.n;
    if (n === '토요휴업일') return 'sat';
    if (/방학$/.test(n)) return 'vac';
    if (/(입학식|졸업식|종업식|시업식|개학식|방학식)/.test(n)) return 'cer';
    if (e.off) return 'hol';
    if (/(교육|훈련)/.test(n)) return 'edu';
    return 'evt';
  }

  /* 이어지는 같은 일정은 한 줄로 묶는다 (방학은 주말이 비어도 잇는다) */
  const RANGES = (function(){
    const open = {}, out = [];
    Object.keys(S).sort().forEach(k => {
      const d = parse(k);
      S[k].forEach(e => {
        const c = cat(e);
        if (c === 'sat') return;
        const r = open[e.n], gap = c === 'vac' ? 4 : 1;
        if (r && diff(d, r.to) <= gap) { r.to = d; }
        else { open[e.n] = {n:e.n, c:c, from:d, to:d}; out.push(open[e.n]); }
      });
    });
    return out.sort((a,b) => a.from - b.from);
  })();

  const st = {
    tab:'schedule', view:'cal',
    y:TODAY.getFullYear(), m:TODAY.getMonth(), sel:TK,
    mealDate:TODAY, mealView:'day'
  };
  if (new Date(st.y, st.m, 1) < FIRST || new Date(st.y, st.m, 1) > LAST) { st.y = FIRST.getFullYear(); st.m = FIRST.getMonth(); }

  /* ---------- 머리·오늘 ---------- */
  function renderHead(){
    const s = D.school;
    $('sname').textContent = s.name;
    let h = esc(s.addr);
    if (s.tel) h += ' · ' + esc(s.tel);
    if (s.home) h += ' · <a href="' + esc(s.home) + '" target="_blank" rel="noopener">학교 홈페이지</a>';
    $('sinfo').innerHTML = h;
    $('updated').textContent = '마지막으로 받아온 때: ' + D.fetched;
  }

  function dishLine(k){
    return (M[k] || []).map(x => x.d.map(o => o.n).join(', ')).join(' / ');
  }

  function renderToday(){
    let meal;
    if (M[TK]) {
      meal = '<p class="menu">' + esc(dishLine(TK)) + '</p>';
    } else {
      const nk = mealKeys.find(k => k > TK);
      meal = '<p class="none">오늘은 급식이 없어요.</p>' +
        (nk ? '<p class="menu"><b>' + mdw(parse(nk)) + '</b> ' + esc(dishLine(nk)) + '</p>' : '');
    }
    const soon = RANGES.filter(r => r.to >= TODAY).slice(0,4).map(r => {
      const n = diff(r.from, TODAY);
      const dd = n > 0 ? 'D-' + n : (n === 0 && diff(r.to, TODAY) === 0 ? '오늘' : '진행 중');
      const when = r.from - r.to === 0 ? mdw(r.from) : md(r.from) + ' ~ ' + md(r.to);
      return '<li><span class="dday">' + dd + '</span><span>' + esc(r.n) + '</span><span class="when">' + when + '</span></li>';
    }).join('');
    $('today').innerHTML =
      '<div class="tcard"><h2>오늘 급식</h2><div class="big">' + mdw(TODAY) + '</div>' + meal +
      '<div><button class="link" id="go-meal">급식 자세히 보기</button></div></div>' +
      '<div class="tcard"><h2>다가오는 일정</h2>' +
      (soon ? '<ul class="soon">' + soon + '</ul>' : '<p class="none">남은 일정이 없어요.</p>') + '</div>';
    $('go-meal').onclick = () => { st.mealDate = M[TK] ? TODAY : parse(mealKeys.find(k => k > TK) || TK); st.mealView = 'day'; setTab('meal'); };
  }

  /* ---------- 탭 ---------- */
  function setTab(t){
    st.tab = t;
    ['schedule','meal'].forEach(n => {
      $('tab-'+n).setAttribute('aria-selected', String(n === t));
      $('panel-'+n).hidden = n !== t;
    });
    try { history.replaceState(null, '', '#' + t); } catch(e) {}
    if (t === 'meal') renderMeal(); else renderSched();
  }

  /* ---------- 학사일정 ---------- */
  function renderSched(){
    const cur = new Date(st.y, st.m, 1);
    $('m-title').textContent = st.y + '년 ' + (st.m+1) + '월';
    $('m-prev').disabled = cur <= FIRST;
    $('m-next').disabled = cur >= LAST;
    $('v-cal').setAttribute('aria-pressed', String(st.view === 'cal'));
    $('v-list').setAttribute('aria-pressed', String(st.view === 'list'));
    $('sched-body').innerHTML = st.view === 'cal' ? calHTML() : listHTML();
    if (st.view === 'cal') {
      $('sched-body').querySelectorAll('.day').forEach(b => b.onclick = () => { st.sel = b.dataset.k; renderSched(); });
      const g = $('go-meal2');
      if (g) g.onclick = () => { st.mealDate = parse(st.sel); st.mealView = 'day'; setTab('meal'); };
    }
  }

  function calHTML(){
    const first = new Date(st.y, st.m, 1);
    const start = addDays(first, -first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(st.y, st.m+1, 0).getDate()) / 7);
    let h = '<div class="cal">';
    WD.forEach((w,i) => h += '<div class="wd' + (i===0?' sun':i===6?' sat':'') + '">' + w + '</div>');
    for (let i = 0; i < weeks*7; i++) {
      const d = addDays(start, i), k = key(d), ev = S[k] || [];
      const cls = ['day'];
      if (d.getMonth() !== st.m) cls.push('out');
      if (d.getDay() === 0) cls.push('sun');
      if (d.getDay() === 6) cls.push('sat');
      if (ev.some(e => e.off && cat(e) !== 'sat')) cls.push('off');
      if (k === TK) cls.push('today');
      if (k === st.sel) cls.push('sel');
      const shown = ev.slice(0,2).map(e => '<span class="chip c-' + cat(e) + '">' + esc(e.n) + '</span>').join('');
      const more = ev.length > 2 ? '<span class="more">+' + (ev.length-2) + '</span>' : '';
      const label = mdw(d) + (ev.length ? ' ' + ev.map(e => e.n).join(', ') : '');
      h += '<button class="' + cls.join(' ') + '" data-k="' + k + '" aria-label="' + esc(label) + '">' +
           '<span class="num">' + d.getDate() + '</span>' + shown + more + '</button>';
    }
    h += '</div>' + detailHTML();
    return h;
  }

  function detailHTML(){
    const d = parse(st.sel), ev = S[st.sel] || [];
    let h = '<div class="detail"><h3>' + mdw(d) + (st.sel === TK ? ' · 오늘' : '') + '</h3>';
    h += ev.length
      ? '<div class="row">' + ev.map(e => '<span class="chip c-' + cat(e) + '">' + esc(e.n) + '</span>').join('') + '</div>'
      : '<p>학사일정이 없는 날이에요.</p>';
    if (M[st.sel]) h += '<p>급식: ' + esc(dishLine(st.sel)) + ' <button class="link" id="go-meal2">자세히</button></p>';
    return h + '</div>';
  }

  function listHTML(){
    const a = new Date(st.y, st.m, 1), b = new Date(st.y, st.m+1, 0);
    const rows = RANGES.filter(r => r.to >= a && r.from <= b);
    if (!rows.length) return '<p class="empty">이 달에는 등록된 일정이 없어요.</p>';
    return '<ul class="list">' + rows.map(r => {
      const when = r.from - r.to === 0 ? mdw(r.from) : mdw(r.from) + ' ~ ' + mdw(r.to);
      return '<li class="' + (r.to < TODAY ? 'past' : '') + '"><span class="when">' + when + '</span>' +
             '<span class="what"><i class="d-' + r.c + '"></i>' + esc(r.n) + '</span></li>';
    }).join('') + '</ul>';
  }

  function moveMonth(n){
    const d = new Date(st.y, st.m + n, 1);
    if (d < FIRST || d > LAST) return;
    st.y = d.getFullYear(); st.m = d.getMonth();
    st.sel = (st.y === TODAY.getFullYear() && st.m === TODAY.getMonth()) ? TK : key(d);
    renderSched();
  }

  /* ---------- 급식 ---------- */
  function mealCard(k, withDate){
    const d = parse(k), list = M[k];
    const head = withDate ? mdw(d) : '';
    if (!list) {
      const why = mealKeys.length && k > mealKeys[mealKeys.length-1]
        ? '아직 식단이 올라오지 않았어요.' : '급식이 없는 날이에요.';
      return '<article class="meal' + (k === TK ? ' is-today' : '') + '">' +
        (withDate ? '<header><b>' + head + '</b></header>' : '') +
        '<p class="nomeal">' + why + '</p></article>';
    }
    return list.map(x => {
      const dishes = x.d.map(o => '<li>' + esc(o.n) + (o.a.length ? '<sup>' + o.a.join('.') + '</sup>' : '') + '</li>').join('');
      const cells = arr => arr.map(t => '<span>' + esc(t) + '</span>').join('');
      return '<article class="meal' + (k === TK ? ' is-today' : '') + '">' +
        '<header><b>' + (withDate ? head + ' · ' : '') + esc(x.t) + '</b><span>' + esc(x.kcal) + '</span></header>' +
        '<ul>' + dishes + '</ul>' +
        (x.ntr.length ? '<details><summary>영양 정보</summary><div>' + cells(x.ntr) + '</div></details>' : '') +
        (x.org.length ? '<details><summary>원산지</summary><div>' + cells(x.org.filter(t => !/^비고\s*:\s*$/.test(t))) + '</div></details>' : '') +
        '</article>';
    }).join('');
  }

  function renderMeal(){
    const d = st.mealDate;
    $('d-input').value = key(d);
    $('mv-day').setAttribute('aria-pressed', String(st.mealView === 'day'));
    $('mv-week').setAttribute('aria-pressed', String(st.mealView === 'week'));
    if (st.mealView === 'day') {
      $('meal-title').textContent = d.getFullYear() + '년 ' + mdw(d) + (key(d) === TK ? ' · 오늘' : '');
      $('meal-body').innerHTML = mealCard(key(d), false);
    } else {
      const mon = addDays(d, -((d.getDay() + 6) % 7));
      $('meal-title').textContent = md(mon) + ' ~ ' + md(addDays(mon, 4)) + ' 주간 식단';
      let h = '';
      for (let i = 0; i < 5; i++) h += mealCard(key(addDays(mon, i)), true);
      $('meal-body').innerHTML = h;
    }
  }

  function moveMeal(n){
    st.mealDate = addDays(st.mealDate, st.mealView === 'week' ? n*7 : n);
    renderMeal();
  }

  /* ---------- 가족사진 ---------- */
  function renderFamily(){
    const inner = PHOTO
      ? '<img src="' + PHOTO + '" alt="가족사진">'
      : '<div class="ph">가족사진이 들어갈 자리</div>';
    $('family').innerHTML = '<div class="frame">' + inner +
      (CAPTION ? '<figcaption>' + esc(CAPTION) + '</figcaption>' : '<div style="height:10px"></div>') + '</div>';
  }

  /* ---------- 연결 ---------- */
  $('tab-schedule').onclick = () => setTab('schedule');
  $('tab-meal').onclick = () => setTab('meal');
  $('v-cal').onclick = () => { st.view = 'cal'; renderSched(); };
  $('v-list').onclick = () => { st.view = 'list'; renderSched(); };
  $('m-prev').onclick = () => moveMonth(-1);
  $('m-next').onclick = () => moveMonth(1);
  $('m-today').onclick = () => { st.y = TODAY.getFullYear(); st.m = TODAY.getMonth(); st.sel = TK; renderSched(); };
  $('mv-day').onclick = () => { st.mealView = 'day'; renderMeal(); };
  $('mv-week').onclick = () => { st.mealView = 'week'; renderMeal(); };
  $('d-prev').onclick = () => moveMeal(-1);
  $('d-next').onclick = () => moveMeal(1);
  $('d-today').onclick = () => { st.mealDate = TODAY; renderMeal(); };
  $('d-input').onchange = e => { if (e.target.value) { st.mealDate = parse(e.target.value); renderMeal(); } };

  renderHead();
  renderToday();
  renderFamily();
  setTab(location.hash === '#meal' ? 'meal' : 'schedule');
})();
</script>

</body>
</html>
